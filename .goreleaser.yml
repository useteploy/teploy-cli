version: 2

builds:
  - main: ./cmd/teploy
    binary: teploy
    flags:
      - -trimpath
      - -buildvcs=false
    env:
      # Without this, the linked-against-glibc Linux binary fails to run
      # at all inside any musl-based container (Alpine) with a bare "no
      # such file or directory" — the actual error is a missing dynamic
      # linker, not a missing file. Found live: a freshly downloaded
      # release binary failed this way inside Alpine, breaking every
      # delegate-to-CLI action in a containerized teploy-dash deployment.
      # teploy-dash and teploy-observe's own goreleaser configs already
      # set this; teploy-cli's never did.
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "teploy_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# Distribution manifests are rendered from verified archive checksums by
# scripts/render-distribution.py and published by the release workflow.
